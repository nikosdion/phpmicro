# Build the sibling-payload micro.sfx runtimes for Grafida.
#
# phpmicro is a PHP SAPI: it cannot be built standalone. This workflow checks
# out stock static-php-cli as the build tool and points it back at THIS
# repository (-L custom-local source), producing a statically linked micro.sfx
# per platform with the extension set Boson's "standard" macOS edition ships.
#
# Every push to sibling-phar refreshes the rolling "sfx-latest" release, whose
# assets Grafida's scripts/fetch-sfx.sh downloads into build/sfx/.
name: Build micro.sfx

on:
  push:
    branches: [sibling-phar]
  workflow_dispatch:

env:
  PHP_VERSION: "8.4"
  # Boson's STANDARD_SFX_EXTENSIONS (vendor/boson-php/compiler, MacOSBuiltinTarget)
  EXTENSIONS: "ctype,curl,dom,ffi,filter,iconv,libxml,mbstring,opcache,openssl,pdo,pdo_sqlite,phar,shmop,sockets,sodium,sqlite3,xml,zlib"
  # static-php-cli downloads prebuilt tools/sources from GitHub; without a token
  # the anonymous API rate limit on shared runners makes those downloads fail.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            asset: macos-aarch64.standard.sfx
          - runner: macos-15-intel
            asset: macos-x86_64.standard.sfx
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, openssl, mbstring, tokenizer, phar

      - name: Check out static-php-cli (build tool)
        run: git clone --depth=1 https://github.com/crazywhalecc/static-php-cli.git spc-tool

      - name: Prepare static-php-cli
        working-directory: spc-tool
        run: |
          composer install --no-interaction --no-progress
          bin/spc doctor --auto-fix

      - name: Download sources (php-micro = this repository)
        working-directory: spc-tool
        run: |
          bin/spc download --with-php=${{ env.PHP_VERSION }} \
            --for-extensions="${{ env.EXTENSIONS }}" \
            -L "php-micro:${{ github.workspace }}"
          # (-L records the local path; nothing lands in downloads/php-micro.
          # The smoke-test step below is the real guard that the sibling patch
          # made it into the binary — its sibling modes fail on stock phpmicro.)

      - name: Build micro.sfx
        working-directory: spc-tool
        run: bin/spc build "${{ env.EXTENSIONS }}" --build-micro

      - name: Smoke-test the sibling payload modes
        working-directory: spc-tool
        run: |
          SFX=buildroot/bin/micro.sfx
          printf '<?php echo "ok\n";' > t.php
          # appended (regression)
          cat "$SFX" t.php > comb && chmod +x comb
          test "$(./comb)" = ok
          # sibling "<self>.phar"
          cp "$SFX" t && chmod +x t && cp t.php t.phar
          test "$(./t)" = ok
          # sibling "../Resources/<self>.phar" (macOS bundle layout)
          mkdir -p B/Contents/MacOS B/Contents/Resources
          cp "$SFX" B/Contents/MacOS/t && chmod +x B/Contents/MacOS/t
          cp t.php B/Contents/Resources/t.phar
          test "$(B/Contents/MacOS/t)" = ok

      - name: Rename artifact
        run: |
          mkdir -p out
          cp spc-tool/buildroot/bin/micro.sfx "out/${{ matrix.asset }}"
          shasum -a 256 "out/${{ matrix.asset }}" > "out/${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/*

  # Windows is a separate job: static-php-cli uses a different toolchain there
  # (php-sdk-binary-tools + MSVC, not autotools), PE executables must be named
  # *.exe to run, and there is no chmod — so the download/build steps mirror the
  # unix job but the smoke test and packaging are PowerShell.
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, openssl, mbstring, tokenizer, phar

      - name: Check out static-php-cli (build tool)
        run: git clone --depth=1 https://github.com/crazywhalecc/static-php-cli.git spc-tool

      - name: Prepare static-php-cli
        working-directory: spc-tool
        # --no-dev: SPC needs none of its dev tools to build micro.sfx, and one of
        # them (captainhook/captainhook-phar via phar-io/composer-distributor)
        # GPG-verifies a PHAR download during install, which fails on the Windows
        # runner ("Could not import required GPG key!"). Skipping dev deps sidesteps
        # GPG entirely and is deterministic. (The unix job keeps dev deps — its
        # runners have a working gpg — but --no-dev would be fine there too.)
        run: |
          composer install --no-interaction --no-progress --no-dev
          bin/spc doctor --auto-fix

      - name: Download sources (php-micro = this repository)
        working-directory: spc-tool
        run: >
          bin/spc download --with-php=${{ env.PHP_VERSION }}
          --for-extensions="${{ env.EXTENSIONS }}"
          -L "php-micro:${{ github.workspace }}"

      - name: Build micro.sfx
        working-directory: spc-tool
        run: bin/spc build "${{ env.EXTENSIONS }}" --build-micro

      - name: Smoke-test the sibling payload modes
        working-directory: spc-tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Run a native console app and capture its stdout. Start-Process with an
          # explicit -RedirectStandardOutput genuinely redirects the child's stdout
          # (unlike pwsh's `& native > file`, which under a Stop preference throws
          # "StandardOutputEncoding is only supported when standard output is
          # redirected"), so it works reliably for phpmicro's CLI output.
          function Invoke-Payload([string]$name) {
              $exe  = Join-Path $PWD $name
              $outF = Join-Path $PWD 'run.out'
              $errF = Join-Path $PWD 'run.err'
              $p = Start-Process -FilePath $exe -WorkingDirectory $PWD -NoNewWindow -Wait -PassThru `
                     -RedirectStandardOutput $outF -RedirectStandardError $errF
              if ($p.ExitCode -ne 0) {
                  Write-Host "stderr: $(Get-Content $errF -Raw)"
                  throw "$name exited $($p.ExitCode)"
              }
              return (Get-Content $outF -Raw).Trim()
          }

          $sfx = 'buildroot/bin/micro.sfx'
          if (-not (Test-Path $sfx)) { throw "micro.sfx not built at $sfx" }
          Set-Content -NoNewline -Path t.php -Value '<?php echo "ok";'

          # appended payload (regression): micro.sfx PE + script, concatenated into
          # a PE. Build it via a FileStream — cmd's `copy /b` mis-parses forward-
          # slash paths, and `byte[] + byte[]` in pwsh boxes into a huge Object[].
          $fs = [System.IO.File]::Create((Join-Path $PWD 'comb.exe'))
          foreach ($part in @($sfx, 't.php')) {
              $bytes = [System.IO.File]::ReadAllBytes($part)
              $fs.Write($bytes, 0, $bytes.Length)
          }
          $fs.Close()
          $out = Invoke-Payload 'comb.exe'
          if ($out -ne 'ok') { throw "appended mode failed: got '$out'" }

          # sibling "<self>.phar" (grafida ships the split payload as t.exe + t.phar)
          Copy-Item $sfx t.exe
          Copy-Item t.php t.phar
          $out = Invoke-Payload 't.exe'
          if ($out -ne 'ok') { throw "sibling mode failed: got '$out'" }
          Write-Host 'sibling payload smoke test passed'

          # SIGNED sibling stub — the layout grafida actually ships. Authenticode
          # appends a certificate table at EOF, PAST the last PE section, so the
          # signed stub's file size exceeds its section end. sfxsize must fold in
          # the certificate table (IMAGE_DIRECTORY_ENTRY_SECURITY); otherwise the
          # stub looks like it carries an appended payload and the sibling fallback
          # never fires — it would try to load the certificate as the phar. Verify
          # with a throwaway self-signed cert (trust is irrelevant; we only need the
          # certificate table appended so the runtime hits that code path).
          Copy-Item $sfx signed.exe
          Copy-Item t.php signed.phar
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
                    -Subject 'CN=Grafida SFX Smoke Test' -CertStoreLocation Cert:\CurrentUser\My
          $null = Set-AuthenticodeSignature -FilePath signed.exe -Certificate $cert
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force
          if ((Get-Item signed.exe).Length -le (Get-Item $sfx).Length) {
              throw "signing did not append a certificate table (test would be a no-op)"
          }
          $out = Invoke-Payload 'signed.exe'
          if ($out -ne 'ok') { throw "signed sibling mode failed: got '$out'" }
          Write-Host 'signed sibling payload smoke test passed'

      - name: Rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $asset = 'windows-x86_64.standard.sfx'
          Copy-Item spc-tool/buildroot/bin/micro.sfx "out/$asset"
          # Emit "<hash>  <name>" so scripts/fetch-sfx.sh (awk '{print $1}') reads it
          $hash = (Get-FileHash "out/$asset" -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path "out/$asset.sha256" -Value "$hash  $asset"

      # Collect the Visual C++ 2015-2022 runtime DLLs (app-local redistributable)
      # and publish them alongside the SFX. They are NOT a phpmicro dependency (the
      # SFX is statically linked); they are for the CONSUMER: Boson's prebuilt
      # libboson-windows-x86_64.dll imports MSVCP140*/VCRUNTIME140*, which a clean
      # Windows (especially Server) lacks. Grafida ships them next to grafida.exe so
      # its per-user, no-admin installer is self-contained. This Windows CI is the
      # only place in the toolchain with a real VS install, hence here. Sourced from
      # the VS Redist folder — the canonical redistributable copy, app-local
      # deployment permitted by its license.
      - name: Collect the Visual C++ runtime (for Grafida's app-local bundle)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          if (-not $vs) { throw "Visual Studio not found via vswhere" }
          $redist = Join-Path $vs 'VC\Redist\MSVC'
          # newest redist version, then its x64 Microsoft.VC<nn>.CRT folder
          $ver = Get-ChildItem $redist -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $crt = Get-ChildItem (Join-Path $ver.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' |
                   Select-Object -First 1
          if (-not $crt) { throw "VC CRT redist folder not found under $($ver.FullName)\x64" }
          Write-Host "VC++ CRT redist: $($crt.FullName)"
          $need = @('VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll','MSVCP140_ATOMIC_WAIT.dll')
          New-Item -ItemType Directory -Force -Path vcrt | Out-Null
          foreach ($d in $need) {
              $src = Join-Path $crt.FullName $d
              if (-not (Test-Path $src)) { throw "missing $d in $($crt.FullName)" }
              Copy-Item $src (Join-Path 'vcrt' $d)
          }
          $zip = 'out/vc-runtime-x86_64.zip'
          Compress-Archive -Path vcrt/* -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Path "$zip.sha256" -Value "$hash  vc-runtime-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64.standard.sfx
          path: out/*

  publish:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish rolling sfx-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Rolling build of the sibling-payload micro.sfx runtimes (PHP ${PHP_VERSION}, branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA})."
          gh release view sfx-latest >/dev/null 2>&1 \
            || gh release create sfx-latest --title "micro.sfx (rolling)" --notes "$NOTES" --latest=false
          gh release edit sfx-latest --notes "$NOTES"
          gh release upload sfx-latest assets/* --clobber
